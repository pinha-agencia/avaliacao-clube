\"saved\" id=\"s-${esc(o.p)}\"><\/span><button class=\"next\" data-act=\"next\">Próximo →<\/button><\/div>`;\n}\n\nfunction ligarCard(el){\n  const p = el.dataset.p, o = D.operadores.find(x => x.p===p);\n  el.addEventListener('click', ev => {\n    const b = ev.target.closest('[data-act]'); if(!b || D.enviado && b.dataset.act!=='toggle' && b.dataset.act!=='next') return;\n    const r = resp(p), act = b.dataset.act, v = b.dataset.v;\n    if(act==='toggle'){ aberto = aberto===p ? null : p; redesenhar(el, o); if(aberto) el.scrollIntoView({behavior:'smooth',block:'start'}); return; }\n    if(act==='next'){ proximo(p); return; }\n    if(act==='req'){ r.requisito = r.requisito===v ? '' : v; if(r.requisito!=='Sim'){ r.nota=null; r.parecer=''; } }\n    if(act==='nota'){ r.nota = Number(v); if(!r.parecer) r.parecer = r.nota>=D.corte ? 'Entra' : ''; if(r.nota<D.corte && r.parecer==='Entra') r.parecer=''; }\n    if(act==='par'){ if(v==='Entra' && r.nota!==null && r.nota<D.corte){ toast('Com nota abaixo de '+D.corte+', escolha Espera ou Não entra.'); return; } r.parecer = r.parecer===v ? '' : v; }\n    if(act==='marc'){ r.marcador = r.marcador===v ? '' : v; if(r.marcador){ r.requisito=''; r.nota=null; r.parecer=''; r.motivo = v==='vinculo' ? 'Vínculo' : 'Não conheço'; } else r.motivo=''; }\n    redesenhar(el, o); agendar(p);\n  });\n  el.addEventListener('input', ev => {\n    if(ev.target.dataset.act!=='mot') return;\n    resp(p).motivo = ev.target.value;\n    ev.target.classList.toggle('req', precisaMotivo(resp(p)) && !ev.target.value.trim());\n    atualizarPill(el, p); agendar(p);\n  });\n}\n\nfunction redesenhar(el, o){\n  const tmp = document.createElement('div'); tmp.innerHTML = cardHTML(o);\n  const novo = tmp.firstElementChild; el.replaceWith(novo); ligarCard(novo); atualizarResumo();\n}\nfunction atualizarPill(el, p){\n  const ok = completo(resp(p)); el.classList.toggle('done', ok);\n  const pill = el.querySelector('.pill'); pill.className = 'pill '+(ok?'d':'p'); pill.textContent = ok?'Avaliado':'Pendente';\n  atualizarResumo();\n}\nfunction atualizarResumo(){\n  const feitos = D.operadores.filter(o => completo(D.respostas[o.p])).length;\n  const b = document.querySelector('.prog b'); if(b) b.textContent = feitos;\n  const i = document.querySelector('.bar i'); if(i) i.style.width = Math.round(feitos/D.operadores.length*100)+'%';\n  document.getElementById('sendtxt').textContent = feitos===D.operadores.length ? 'Tudo avaliado. Revise e envie.' : `Faltam ${D.operadores.length-feitos} para enviar.`;\n  document.getElementById('sendbtn').disabled = feitos!==D.operadores.length;\n}\nfunction proximo(p){\n  const pend = D.operadores.filter(o => o.p!==p && !completo(D.respostas[o.p]));\n  aberto = pend.length ? pend[0].p : null;\n  if(filtro==='feitos') filtro='pend';\n  render();\n  if(aberto){ const el = document.querySelector(`.card[data-p=\"${CSS.escape(aberto)}\"]`); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }\n  else toast('Todos avaliados. Revise e envie.');\n}\nfunction agendar(p){\n  const s = document.getElementById('s-'+p); if(s) s.textContent = 'Salvando…';\n  clearTimeout(timers[p]);\n  timers[p] = setTimeout(async () => {\n    delete timers[p];\n    try{ await api('salvar', K, p, resp(p)); const s2 = document.getElementById('s-'+p); if(s2) s2.textContent = 'Salvo ✓'; }\n    catch(e){ const s2 = document.getElementById('s-'+p); if(s2) s2.textContent = 'Não salvou'; toast(e.message); }\n  }, 600);\n}\n\ndocument.getElementById('sendbtn').onclick = () => document.getElementById('modal').classList.add('on');\ndocument.getElementById('cancel').onclick = () => document.getElementById('modal').classList.remove('on');\ndocument.getElementById('confirm').onclick = async () => {\n  const b = document.getElementById('confirm'); b.disabled = true; b.textContent = 'Enviando…';\n  try{\n    for(const p of Object.keys(timers)){ clearTimeout(timers[p]); delete timers[p]; await api('salvar', K, p, resp(p)); }\n    await api('enviar', K); D.enviado = new Date().toISOString();\n    document.getElementById('modal').classList.remove('on'); window.scrollTo(0,0); render();\n  }catch(e){ toast(e.message); }\n  b.disabled = false; b.textContent = 'Enviar';\n};\niniciar();\n<\/script>\n<\/body>\n<\/html>\n", "Admin": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<base target=\"_top\">\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Painel · Seleção dos Fundadores<\/title>\n<style>\n:root{--navy:#141B4D;--navy2:#23307A;--yellow:#F5B800;--ink:#161A2B;--muted:#5E6477;--line:#E3E5EC;--bg:#F4F5F8;--ok:#1E8E5A;--warn:#B26A00;--bad:#C0392B}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.45 -apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif}\nbutton{font:inherit;cursor:pointer}\n.top{background:var(--navy);color:#fff;padding:18px 16px;border-bottom:4px solid var(--yellow)}\n.top small{color:#C9CDE6;font-size:12px;letter-spacing:.06em;text-transform:uppercase}\n.top h1{margin:4px 0 0;font-size:20px}\n.wrap{max-width:980px;margin:0 auto;padding:16px}\n.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}\n.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}\n.kpi b{display:block;font-size:24px}.kpi span{color:var(--muted);font-size:12.5px}\nh2{font-size:16px;margin:22px 0 10px}\n.list{display:grid;gap:8px}\n.st{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}\n.st .l1{display:flex;justify-content:space-between;gap:10px;align-items:center}\n.st .nm{font-weight:650}\n.st .sub{color:var(--muted);font-size:12.5px;margin-top:2px}\n.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--yellow)}\n.pill{font-size:12px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap}\n.p0{background:#EEF0F7;color:#2B3354}.p1{background:#FDEBD0;color:var(--warn)}.p2{background:#D8F1E4;color:var(--ok)}.p3{background:#F7D9D5;color:var(--bad)}\n.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}\n.link{background:none;border:0;color:var(--navy2);text-decoration:underline;padding:0;font-size:13px}\n.btn{border:0;background:var(--yellow);color:var(--navy);border-radius:10px;padding:11px 16px;font-weight:700}\n.btn2{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:10px 14px;font-weight:600}\n.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}\n.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}\n.tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;color:var(--muted)}\n.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}\ntable{width:100%;border-collapse:collapse;font-size:13px}\nth,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}\nth{color:var(--muted);font-weight:600;font-size:12px}\n.scroll{overflow-x:auto}\n.muted{color:var(--muted);font-size:12.5px}\n.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;display:none}\n.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#EEF0F7;border-radius:6px;padding:3px 8px;font-size:12.5px}\n<\/style>\n<\/head>\n<body>\n<header class=\"top\"><small>Pinha · Clube de Operadores Florestais Komatsu<\/small><h1>Painel da seleção dos fundadores<\/h1><\/header>\n<main class=\"wrap\" id=\"app\">Carregando…<\/main>\n<div class=\"toast\" id=\"toast\"><\/div>\n<script>\nconst BOOT = <?!= boot ?>;\nconst K = BOOT.k;\nlet P = null, A = null, aba = 'Fundador';\nfunction api(fn, ...args){ return new Promise((ok, err) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => err(e && e.message ? e : new Error(String(e))))[fn](...args)); }\nfunction esc(s){return String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));}\nfunction toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2600);}\nfunction quando(iso){ return iso ? new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''; }\n\nasync function carregar(){ try{ P = await api('painel', K); render(); }catch(e){ document.getElementById('app').textContent = e.message; } }\n\nfunction render(){\n  const tot = P.links.reduce((s,l)=>s+l.total,0), feitos = P.links.reduce((s,l)=>s+l.feitos,0);\n  const env = P.links.filter(l=>l.enviado).length;\n  document.getElementById('app').innerHTML = `\n    <div class=\"kpis\">\n      <div class=\"kpi\"><b>${feitos}/${tot}<\/b><span>operadores avaliados<\/span><\/div>\n      <div class=\"kpi\"><b>${env}/${P.links.length}<\/b><span>estados enviados<\/span><\/div>\n      <div class=\"kpi\"><b>${P.links.filter(l=>l.acesso).length}<\/b><span>links já abertos<\/span><\/div>\n      <div class=\"kpi\"><b>${P.regras.VAGAS}<\/b><span>vagas · corte ${P.regras.CORTE} · máx. ${P.regras.LIMITE_EMPRESA}/empresa<\/span><\/div>\n    <\/div>\n    <div class=\"box\" style=\"margin-top:12px\">${P.aprovacao ? `Processo aprovado por <b>${esc(P.aprovacao.nome)}<\/b> em ${quando(P.aprovacao.em)}.${P.aprovacao.obs ? ' Observação: '+esc(P.aprovacao.obs) : ''}` : '<b>Aguardando aprovação da Komatsu.<\/b> Envie à Karol o link da Área Komatsu.'}\n      <div class=\"acts\"><button class=\"link\" data-copy=\"${esc(P.url)}?k=${encodeURIComponent(P.komatsuKey)}\">Copiar link da Área Komatsu<\/button><a class=\"link\" href=\"${esc(P.url)}?k=${encodeURIComponent(K)}&v=instrutor\" target=\"_blank\" rel=\"noopener\">Ver tela do instrutor (exemplo)<\/a><\/div><\/div>\n    <h2>Estados e links<\/h2>\n    <div class=\"list\">${P.links.map(l => {\n      const st = l.revogado ? ['p3','Desativado'] : l.enviado ? ['p2','Enviado'] : l.acesso ? ['p1','Em avaliação'] : ['p0','Não aberto'];\n      return `<div class=\"st\"><div class=\"l1\"><div><div class=\"nm\">${esc(l.estado)} · ${l.feitos}/${l.total}<\/div>\n        <div class=\"sub\">${l.indicado ? 'Indicado: '+esc(l.indicado)+(l.email ? ' · '+esc(l.email) : ' · sem e-mail') : 'Sem instrutor indicado'}${l.convite ? ' · convite '+quando(l.convite) : ''}<\/div>\n        <div class=\"sub\">${l.instrutor ? 'Respondendo: '+esc(l.instrutor) : 'Instrutor ainda não se identificou'}${l.acesso ? ' · último acesso '+quando(l.acesso) : ''}${l.enviado ? ' · enviado '+quando(l.enviado) : ''}<\/div><\/div>\n        <span class=\"pill ${st[0]}\">${st[1]}<\/span><\/div>\n        <div class=\"bar\"><i style=\"width:${Math.round(l.feitos/l.total*100)}%\"><\/i><\/div>\n        <div class=\"acts\">${l.email && !l.revogado ? `<button class=\"link\" data-conv=\"${esc(l.link)}\">${l.convite ? 'Reenviar convite' : 'Enviar convite por e-mail'}<\/button>` : ''}<button class=\"link\" data-txt=\"${esc(l.link)}\">Copiar convite<\/button><button class=\"link\" data-copy=\"${esc(l.url)}\">Copiar link<\/button>\n        <button class=\"link\" data-rev=\"${esc(l.link)}\" data-v=\"${l.revogado?0:1}\">${l.revogado?'Reativar link':'Desativar link'}<\/button>\n        ${l.enviado ? `<button class=\"link\" data-reab=\"${esc(l.link)}\">Reabrir para correção<\/button>` : ''}<\/div><\/div>`; }).join('')}<\/div>\n    <h2>Apuração<\/h2>\n    <div class=\"box\"><p class=\"muted\" style=\"margin-top:0\">Aplica as regras do manual sobre as respostas recebidas até agora: requisito mínimo, corte ${P.regras.CORTE}, 1 vaga por estado, mínimo de ${P.regras.MIN_FORWARDER} forwarders e máximo de ${P.regras.LIMITE_EMPRESA} por empresa. Pode rodar quantas vezes quiser.<\/p>\n      <div class=\"acts\"><button class=\"btn\" id=\"apurar\">Apurar agora<\/button><button class=\"btn2\" id=\"gravar\">Gravar resultado na planilha<\/button><a class=\"link\" href=\"${esc(P.base)}\" target=\"_blank\" rel=\"noopener\" style=\"align-self:center\">Abrir base privada<\/a><\/div>\n      <div id=\"res\"><\/div><\/div>`;\n  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try{ await navigator.clipboard.writeText(b.dataset.copy); toast('Link copiado.'); }catch(e){ prompt('Copie o link:', b.dataset.copy); } });\n  document.querySelectorAll('[data-rev]').forEach(b => b.onclick = async () => { if(b.dataset.v==='1' && !confirm('Desativar este link? O instrutor perde o acesso na hora.')) return; await api('revogar', K, b.dataset.rev, b.dataset.v==='1'); carregar(); });\n  document.querySelectorAll('[data-reab]').forEach(b => b.onclick = async () => { if(!confirm('Reabrir para o instrutor corrigir?')) return; await api('reabrir', K, b.dataset.reab); carregar(); });\n  document.querySelectorAll('[data-conv]').forEach(b => b.onclick = async () => {\n    const l = P.links.find(x => x.link===b.dataset.conv);\n    if(!confirm('Enviar o convite de '+l.estado+' para '+l.email+'?')) return;\n    b.disabled = true; b.textContent = 'Enviando…';\n    try{ await api('enviarConvite', K, l.link); toast('Convite enviado para '+l.email+'.'); carregar(); }catch(e){ toast(e.message); b.disabled = false; }\n  });\n  document.querySelectorAll('[data-txt]').forEach(b => b.onclick = async () => {\n    try{ const c = await api('convite', K, b.dataset.txt); const t = 'Assunto: '+c.assunto+'\\n\\n'+c.corpo;\n      try{ await navigator.clipboard.writeText(t); toast('Convite copiado.'); }catch(e){ prompt('Copie o convite:', t); } }catch(e){ toast(e.message); }\n  });\n  document.getElementById('apurar').onclick = () => rodar(false);\n  document.getElementById('gravar').onclick = () => rodar(true);\n  if(A) renderRes();\n}\n\nasync function rodar(gravar){\n  document.getElementById('res').innerHTML = '<p class=\"muted\">Apurando…<\/p>';\n  try{ A = await api('apurar', K, gravar); renderRes(); if(A.planilha){ toast('Resultado gravado na aba \"Resultado\".'); } }\n  catch(e){ document.getElementById('res').textContent = e.message; }\n}\n\nfunction renderRes(){\n  const r = A.resumo;\n  const cols = {\n    'Fundador': ['Nº','Nome','UF','Equip.','Empresa','Nota','Via'],\n    'Lista de espera': ['Pos.','Nome','UF','Empresa','Nota','Motivo registrado'],\n    'Comissão': ['Nome','UF','Empresa','Nota','Caso'],\n    'Não selecionado': ['Nome','UF','Empresa','Motivo registrado','Motivo do instrutor']};\n  const linha = l => aba==='Fundador' ? [l.numero,l.n,l.uf,l.e,l.emp,l.nota,l.via]\n    : aba==='Lista de espera' ? [l.espera,l.n,l.uf,l.emp,l.nota,l.registro]\n    : aba==='Comissão' ? [l.n,l.uf,l.emp,l.nota==null?'':l.nota,l.registro]\n    : [l.n,l.uf,l.emp,l.registro,l.motivo];\n  let rows = A.linhas.filter(l => l.status===aba);\n  if(aba==='Fundador') rows.sort((a,b)=>a.numero-b.numero);\n  if(aba==='Lista de espera') rows.sort((a,b)=>a.espera-b.espera);\n  const emp = Object.entries(A.porEmpresa).sort((a,b)=>b[1]-a[1]);\n  document.getElementById('res').innerHTML = `\n    <div class=\"kpis\" style=\"margin-top:12px\">\n      <div class=\"kpi\"><b>${r.fundadores}<\/b><span>fundadores<\/span><\/div><div class=\"kpi\"><b>${r.espera}<\/b><span>lista de espera<\/span><\/div>\n      <div class=\"kpi\"><b>${r.comissao}<\/b><span>para a comissão<\/span><\/div><div class=\"kpi\"><b>${r.nao}<\/b><span>não selecionados<\/span><\/div>\n      <div class=\"kpi\"><b>${r.forwarders}<\/b><span>forwarders entre fundadores<\/span><\/div><\/div>\n    ${emp.length ? `<p class=\"muted\" style=\"margin:12px 0 6px\">Fundadores por empresa<\/p><div class=\"chips\">${emp.map(([e,n])=>`<span class=\"chip\">${esc(e)} · ${n}<\/span>`).join('')}<\/div>` : ''}\n    <div class=\"tabs\">${Object.keys(cols).map(t=>`<button class=\"tab ${aba===t?'on':''}\" data-t=\"${t}\">${t==='Fundador'?'Fundadores':t} (${A.linhas.filter(l=>l.status===t).length})<\/button>`).join('') ass=\"box\">\n    <h2>Instrutores por estado<\/h2>\n    <p class=\"lead\">Informe quem avalia cada estado. O mesmo instrutor pode cuidar de mais de um estado (por exemplo, MA, RJ e AP, que têm poucos inscritos). ${cad} de ${P.links.length} preenchidos.<\/p>\n    <div class=\"inst\">${P.links.map((l,i)=>`<div class=\"irow\"><div class=\"h\">${esc(l.estado)} <span>${l.total} inscrito(s)<\/span><\/div>\n      <div class=\"f\"><div><label for=\"n${i}\">Nome do instrutor<\/label><input id=\"n${i}\" data-uf=\"${esc(l.uf)}\" data-c=\"nome\" value=\"${esc(l.indicado)}\" placeholder=\"Nome\"><\/div>\n      <div><label for=\"e${i}\">E-mail<\/label><input id=\"e${i}\" data-uf=\"${esc(l.uf)}\" data-c=\"email\" type=\"email\" inputmode=\"email\" value=\"${esc(l.email)}\" placeholder=\"nome@empresa.com\"><\/div><\/div><\/div>`).join('')}<\/div>\n    <p style=\"margin:14px 0 0\"><button class=\"btn\" id=\"salvar\">Salvar instrutores<\/button><\/p>\n  <\/section>\n\n  <section class=\"box\">\n    <h2>Andamento por estado<\/h2>\n    <div class=\"kpis\"><div class=\"kpi\"><b>${feitos}/${tot}<\/b><span>avaliados<\/span><\/div><div class=\"kpi\"><b>${concl}/${P.links.length}<\/b><span>estados concluídos<\/span><\/div><div class=\"kpi\"><b>${esc(P.prazo)}<\/b><span>prazo<\/span><\/div><\/div>\n    ${P.links.map(l=>{ const s=status(l); return `<div class=\"st\"><div class=\"l1\"><div><div class=\"nm\">${esc(l.estado)} · ${l.feitos}/${l.total}<\/div>\n      <div class=\"sub\">${esc(l.instrutor || l.indicado || 'Sem instrutor indicado')}${l.acesso ? ' · último acesso '+quando(l.acesso) : ''}${l.enviado ? ' · concluído '+quando(l.enviado) : ''}<\/div><\/div>\n      <span class=\"pill ${s[0]}\">${s[1]}<\/span><\/div><div class=\"bar\"><i style=\"width:${Math.round(l.feitos/l.total*100)}%\"><\/i><\/div><\/div>`; }).join('')}\n    <p class=\"muted\" style=\"margin:10px 0 0\">Esta página mostra o andamento. Notas e pareceres ficam com a comissão até a apuração.<\/p>\n  <\/section>`;\n  const a
